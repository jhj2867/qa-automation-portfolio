name: Run Tests

on:
  # cron is UTC-only; 15:00 UTC = 00:00 KST (midnight, Korea time)
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Install Allure commandline
        run: npm install -g allure-commandline --save-dev

      # Trend data lives across runs in a cache entry (there is no gh-pages
      # branch to read it back from, since Pages is deployed via Actions).
      # Key always includes run_id so the post-job save is never skipped as
      # a "duplicate key"; restore-keys falls back to the most recent entry.
      # Shared cache keys with pages.yml, so scheduled and push-triggered
      # runs both feed the same trend history.
      - name: Restore Allure history (API)
        uses: actions/cache@v4
        with:
          path: allure-history/api
          key: allure-history-api-${{ github.run_id }}
          restore-keys: allure-history-api-

      - name: Restore Allure history (UI)
        uses: actions/cache@v4
        with:
          path: allure-history/ui
          key: allure-history-ui-${{ github.run_id }}
          restore-keys: allure-history-ui-

      - name: Run API tests
        working-directory: api-test-automation-framework
        run: mvn -B test
        continue-on-error: true

      - name: Run UI tests
        working-directory: ui-test-automation-saucedemo
        run: mvn -B test
        continue-on-error: true

      - name: Seed previous history into results (API)
        if: always()
        run: |
          mkdir -p api-test-automation-framework/target/allure-results
          if [ -d allure-history/api/history ]; then
            cp -r allure-history/api/history api-test-automation-framework/target/allure-results/history
          fi

      - name: Seed previous history into results (UI)
        if: always()
        run: |
          mkdir -p ui-test-automation-saucedemo/target/allure-results
          if [ -d allure-history/ui/history ]; then
            cp -r allure-history/ui/history ui-test-automation-saucedemo/target/allure-results/history
          fi

      - name: Generate Allure report (API)
        if: always()
        run: allure generate api-test-automation-framework/target/allure-results --clean -o allure-report/api

      - name: Generate Allure report (UI)
        if: always()
        run: allure generate ui-test-automation-saucedemo/target/allure-results --clean -o allure-report/ui

      - name: Save history for next run (API)
        if: always()
        run: |
          mkdir -p allure-history/api
          rm -rf allure-history/api/history
          cp -r allure-report/api/history allure-history/api/history

      - name: Save history for next run (UI)
        if: always()
        run: |
          mkdir -p allure-history/ui
          rm -rf allure-history/ui/history
          cp -r allure-report/ui/history allure-history/ui/history

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
